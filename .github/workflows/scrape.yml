name: scrape

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: parser/requirements.txt

      - run: pip install -r parser/requirements.txt

      - run: python parser/build_data.py
        working-directory: ${{ github.workspace }}

      - run: |
          git config user.name 'shifer-bot'
          git config user.email 'bot@shifer.app'
          git add docs/data.json
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m 'update data.json'
          for attempt in 1 2 3; do
            if git push; then echo "pushed (attempt $attempt)"; exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git fetch origin main
            if ! git rebase origin/main; then
              # data.json is generated — keep our fresh copy and continue
              git checkout --theirs docs/data.json
              git add docs/data.json
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
          done
          echo "failed to push after 3 attempts"; exit 1
